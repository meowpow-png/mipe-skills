name: Release

permissions:
  contents: write
  packages: write
  actions: read

on:
  push:
    tags:
      - "*/v*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      ORAS_VERSION: 1.3.3
      REGISTRY: ghcr.io/meowpow-png/mipe-skills
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Parse tag
        id: tag
        run: |
          bundle="${GITHUB_REF_NAME%/v*}"
          version="${GITHUB_REF_NAME##*/v}"
          echo "bundle=${bundle}" >>"$GITHUB_OUTPUT"
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - name: Validate version format
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: .github/scripts/check-version-format.sh "$VERSION"

      - name: Verify bundle exists
        env:
          BUNDLE: ${{ steps.tag.outputs.bundle }}
        run: .github/scripts/check-bundle-exists.sh "$BUNDLE"

      - name: Verify tag version matches manifest
        env:
          BUNDLE: ${{ steps.tag.outputs.bundle }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: .github/scripts/check-version-matches-manifest.sh "$BUNDLE" "$VERSION"

      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/check-ci-passed.sh "$GITHUB_SHA"

      - name: Verify changelog entry exists
        env:
          BUNDLE: ${{ steps.tag.outputs.bundle }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: .github/scripts/check-changelog-entry.sh "$BUNDLE" "$VERSION"

      - name: Install oras
        run: .github/scripts/install-oras.sh "$ORAS_VERSION"

      - name: Log in to registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | .github/scripts/oras-login.sh "$ACTOR"

      - name: Verify version not already published
        env:
          BUNDLE: ${{ steps.tag.outputs.bundle }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: .github/scripts/check-not-published.sh "$BUNDLE" "$VERSION"

      - name: Package bundle
        env:
          BUNDLE: ${{ steps.tag.outputs.bundle }}
        run: scripts/package.sh "$BUNDLE"

      - name: Push bundle
        env:
          BUNDLE: ${{ steps.tag.outputs.bundle }}
        run: scripts/push.sh "$BUNDLE"

      - name: Extract changelog entry
        env:
          BUNDLE: ${{ steps.tag.outputs.bundle }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: .github/scripts/extract-changelog-entry.sh "$BUNDLE" "$VERSION" >release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.tag.outputs.bundle }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          .github/scripts/create-release.sh \
            "$GITHUB_REF_NAME" \
            "$BUNDLE" \
            "$VERSION" \
            release-notes.md

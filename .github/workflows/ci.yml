name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualitycheck:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Lint shell scripts
        id: lint
        continue-on-error: true
        run: just lint-sh

      - name: Check shell script formatting
        id: fmt
        continue-on-error: true
        run: just fmt-sh

      - name: Generate job summary
        env:
          LINT_STATUS: ${{ steps.lint.outcome }}
          FORMAT_STATUS: ${{ steps.fmt.outcome }}
        run: .github/scripts/quality-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Report check results
        if: always()
        run: |
          outcomes=(
            "${{ steps.lint.outcome }}"
            "${{ steps.fmt.outcome }}"
          )
          for outcome in "${outcomes[@]}"; do
            [ "$outcome" = "success" ] || exit 1
          done

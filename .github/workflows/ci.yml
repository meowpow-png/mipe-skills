name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualitycheck:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          wget https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xf shellcheck-v0.11.0.linux.x86_64.tar.xz
          sudo cp shellcheck-v0.11.0/shellcheck /usr/bin/

      - name: Install shfmt
        uses: mfinelli/setup-shfmt@v4
        with:
          shfmt-version: 3.13.1

      - name: Lint shell scripts
        id: lint
        continue-on-error: true
        run: shellcheck $(find . -name '*.sh' -not -path './.git/*' -not -path './build/*')

      - name: Check shell script formatting
        id: fmt
        continue-on-error: true
        run: shfmt -d $(find . -name '*.sh' -not -path './.git/*' -not -path './build/*')

      - name: Generate job summary
        env:
          LINT_STATUS: ${{ steps.lint.outcome }}
          FORMAT_STATUS: ${{ steps.fmt.outcome }}
        run: .github/scripts/quality-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Report check results
        if: always()
        run: |
          outcomes=(
            "${{ steps.lint.outcome }}"
            "${{ steps.fmt.outcome }}"
          )
          for outcome in "${outcomes[@]}"; do
            [ "$outcome" = "success" ] || exit 1
          done

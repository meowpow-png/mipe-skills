name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package bundles
        run: |
          for manifest in bundles/*.yml; do
            bundle="$(basename "$manifest" .yml)"
            scripts/package.sh "$bundle"
          done

  qualitycheck:
    name: Quality
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHFMT_VERSION: 3.13.1
      DPRINT_VERSION: 0.55.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: .github/scripts/install-shellcheck.sh "$SHELLCHECK_VERSION"

      - name: Install shfmt
        uses: mfinelli/setup-shfmt@v4
        with:
          shfmt-version: ${{ env.SHFMT_VERSION }}

      - name: Install dprint
        run: .github/scripts/install-dprint.sh "$DPRINT_VERSION"

      - name: Lint shell scripts
        id: lint
        continue-on-error: true
        run: shellcheck $(find . -name '*.sh' -not -path './.git/*' -not -path './build/*')

      - name: Check shell script formatting
        id: fmt
        continue-on-error: true
        run: shfmt -d $(find . -name '*.sh' -not -path './.git/*' -not -path './build/*')

      - name: Lint markdown formatting
        id: md
        continue-on-error: true
        run: dprint check

      - name: Generate job summary
        env:
          LINT_STATUS: ${{ steps.lint.outcome }}
          FORMAT_STATUS: ${{ steps.fmt.outcome }}
          MARKDOWN_STATUS: ${{ steps.md.outcome }}
        run: .github/scripts/quality-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Report check results
        if: always()
        run: |
          outcomes=(
            "${{ steps.lint.outcome }}"
            "${{ steps.fmt.outcome }}"
            "${{ steps.md.outcome }}"
          )
          for outcome in "${outcomes[@]}"; do
            [ "$outcome" = "success" ] || exit 1
          done

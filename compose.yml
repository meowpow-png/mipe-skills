name: mipe-skills

services:
  oras:
    build:
      context: .
      dockerfile: docker/oras/Dockerfile
    image: mipe-skills-oras:local
    volumes:
      - .:/workspace:z
      - ${DOCKER_CONFIG:-~/.docker}/config.json:/root/.docker/config.json:ro,Z
    environment:
      REGISTRY: ${REGISTRY:-ghcr.io/meowpow-png/mipe-skills}
      DOCKER_CONFIG: /root/.docker

  claude:
    image: ghcr.io/meowpow-png/mipe-runtime-claude:dev-latest
    working_dir: /workspace
    volumes:
      - claude-home:/home/dev
      - .:/workspace:z
    stdin_open: true
    tty: true

  codex:
    image: ghcr.io/meowpow-png/mipe-runtime-codex:dev-latest
    working_dir: /workspace
    volumes:
      - codex-home:/home/dev/.codex
      - .:/workspace:z
    stdin_open: true
    tty: true

  shellcheck:
    image: koalaman/shellcheck:v0.11.0
    working_dir: /workspace
    volumes:
      - .:/workspace:z,ro

  shfmt:
    image: mvdan/shfmt:v3.13.1
    working_dir: /workspace
    volumes:
      - .:/workspace:z

volumes:
  claude-home:
  codex-home:
